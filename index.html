<!DOCTYPE html>
<html lang="en" class="light scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARMONIC FREQUENCIES — Sounds That Inspire</title>
    <!-- Apply saved theme before first paint (prevents flash). Light is the default. -->
    <script>
        try {
            if (localStorage.getItem('hf-theme') !== 'dark') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
            }
        } catch (e) {}
    </script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pitch: 'rgb(var(--pitch) / <alpha-value>)',
                        ivory: 'rgb(var(--ivory) / <alpha-value>)',
                        'ivory-muted': 'rgb(var(--ivory-muted) / <alpha-value>)',
                        white: 'rgb(var(--white) / <alpha-value>)',
                        'glass-dark': 'rgba(12, 12, 12, 0.75)',
                        'glow-white': 'rgba(255, 255, 255, 0.15)'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Space Mono', 'monospace']
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Lucide Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <style>
        /* ===== THEME TOKENS (space-separated RGB channels) =====
           Dark = original palette. Light = inverted counterpart.
           "--white" is the contrast colour used for borders/overlays:
           white in dark mode, black in light mode. */
        :root {
            --pitch: 3 3 3;
            --ivory: 234 231 223;
            --ivory-muted: 163 160 153;
            --white: 255 255 255;
            --grid-alpha: 0.03;
            --text-glow: 0.4;
            color-scheme: dark;
        }
        html.light {
            --pitch: 247 245 240;
            --ivory: 24 22 18;
            --ivory-muted: 92 88 80;
            --white: 0 0 0;
            --grid-alpha: 0.06;
            --text-glow: 0;
            color-scheme: light;
        }

        body {
            background-color: rgb(var(--pitch));
            color: rgb(var(--ivory));
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Subtle grid background */
        .bg-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgb(var(--white) / var(--grid-alpha)) 1px, transparent 1px),
                linear-gradient(to bottom, rgb(var(--white) / var(--grid-alpha)) 1px, transparent 1px);
        }

        /* Custom glow effects */
        .glow-border {
            box-shadow: 0 0 15px rgb(var(--ivory) / 0.08);
            border: 1px solid rgb(var(--ivory) / 0.15);
        }

        .glow-border-hover:hover {
            box-shadow: 0 0 25px rgb(var(--white) / 0.25);
            border-color: rgb(var(--white) / 0.5);
        }

        .glow-text {
            text-shadow: 0 0 20px rgb(var(--white) / var(--text-glow));
        }

        /* Inline SVG colours follow the theme (identical values in dark mode) */
        svg [stroke="#EAE7DF"] { stroke: rgb(var(--ivory)); }
        svg [stroke="#FFFFFF"] { stroke: rgb(var(--white)); }
        svg [stop-color="#FFFFFF"] { stop-color: rgb(var(--white)); }

        /* Live-calculation indicator stays legible on light backgrounds */
        html.light .text-green-400 { color: #15803d; }

        /* Theme toggle icons: show sun in dark mode, moon in light mode */
        html.light .icon-sun { display: none !important; }
        html:not(.light) .icon-moon { display: none !important; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgb(var(--pitch));
        }
        ::-webkit-scrollbar-thumb {
            background: rgb(var(--white) / 0.14);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgb(var(--white) / 0.28);
        }
    </style>
</head>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">

                <!-- Inline SVG HF Monogram Icon based on logo style -->
                <div class="w-10 h-10 border border-ivory/30 rounded-lg flex items-center justify-center p-1.5 transition-all
